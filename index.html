<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#FFFFFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="책도장">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>가족 책도장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script>window.FB_SDK_BASE="./vendor/firebase/";</script>
<script src="firebase-config.js?v=9f64ae2f"></script>
</head>
<body>
<style>
/* Layout: 앱 화면 — 흰 바탕, 파스텔 아이콘 버블(핑크·하늘·보라·노랑), 둥근 카드, 하단 탭바 */
:root{
  --bg:#FFFFFF; --surface:#F7F6FB; --card:#FFFFFF; --ink:#2A2838; --muted:#8E8BA3; --line:#EEECF4;
  --pink:#FFDCE8; --pink-ink:#D6457B; --sky:#D7EEFF; --sky-ink:#2C7CC4;
  --purple:#EAE2FF; --purple-ink:#6A4FD6; --yellow:#FFF1C1; --yellow-ink:#9C7100;
  --accent:#7A5FF0; --accent-ink:#FFFFFF; --danger:#E4466F;
  --shadow:0 1px 3px rgba(70,50,140,.05),0 8px 22px rgba(70,50,140,.07);
  --f-disp:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono","Noto Sans KR",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-disp);font-weight:400;margin:0;text-wrap:balance}
.mono{font-family:var(--f-mono);font-size:.92em}
.muted{color:var(--muted)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 150px}

/* 아이콘 버블 */
.ib{width:36px;height:36px;border-radius:12px;display:inline-grid;place-items:center;flex:none;background:var(--b,var(--purple));color:var(--bi,var(--purple-ink))}
.ib svg{width:21px;height:21px}
.ib.pink{--b:var(--pink);--bi:var(--pink-ink)} .ib.sky{--b:var(--sky);--bi:var(--sky-ink)} .ib.purple{--b:var(--purple);--bi:var(--purple-ink)} .ib.yellow{--b:var(--yellow);--bi:var(--yellow-ink)}
.ib.lg{width:56px;height:56px;border-radius:18px}.ib.lg svg{width:32px;height:32px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top-in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:12px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand .tx{display:grid;min-width:0;line-height:1.2}
.logo{font-family:var(--f-disp);font-size:22px;color:var(--ink);white-space:nowrap}
.famname{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-chip{display:flex;align-items:center;gap:7px;border:0;background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;font-weight:700;font-size:14px}
.me-chip small{color:var(--muted);font-weight:400;font-size:12px}
.dot{width:26px;height:26px;border-radius:50%;background:var(--c,#E8E2FF);display:inline-grid;place-items:center;color:var(--ci,#5a4ac0);font-family:var(--f-disp);font-size:13px;flex:none}
.icon-btn{width:40px;height:40px;border-radius:14px;border:0;background:var(--surface);display:grid;place-items:center;flex:none;color:var(--ink);font-size:20px}
.icon-btn svg{width:20px;height:20px}

/* 가족 아바타 줄 */
.viewbar{display:flex;gap:14px;overflow-x:auto;padding-block:8px 6px;scrollbar-width:none}
.viewbar::-webkit-scrollbar{display:none}
.av-chip{border:0;background:none;display:grid;justify-items:center;gap:4px;padding:0;font-size:12.5px;color:var(--muted);flex:none;min-width:56px}
.av-chip .av{width:52px;height:52px;border-radius:50%;background:var(--c,var(--purple));color:var(--ci,var(--purple-ink));display:grid;place-items:center;font-family:var(--f-disp);font-size:21px;box-shadow:0 0 0 3px #fff,0 0 0 3px transparent;transition:box-shadow .15s}
.av-chip .av svg{width:26px;height:26px}
.av-chip[aria-pressed="true"]{color:var(--ink);font-weight:700}
.av-chip[aria-pressed="true"] .av{box-shadow:0 0 0 3px #fff,0 0 0 5.5px var(--ci,var(--accent))}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px 6px 7px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font-size:14px}
.chip .dot{width:20px;height:20px;font-size:11px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--purple);color:var(--purple-ink);font-weight:700}

/* sections */
.sec{margin-top:20px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.sec-h h2,.sec-t{font-size:20px}
.sec-title{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sec-title h2{font-size:19px}

/* 이번 달 카드 */
.hero-card{margin-top:10px;border-radius:24px;padding:18px 18px 16px;background:linear-gradient(135deg,var(--pink) 0%,var(--purple) 55%,var(--sky) 100%);display:flex;gap:14px;align-items:center}
.hero-card .k{font-size:13.5px;color:#5b4f7a;font-weight:500}
.hero-card .v{font-family:var(--f-disp);font-size:40px;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--ink)}
.hero-card .v small{font-size:18px;margin-left:2px}
.hero-card .s{font-size:13px;color:#5b4f7a}
.hero-card .grow{flex:1;min-width:0}
.hero-card .bar{background:rgba(255,255,255,.7)}
.hero-card .bar i{background:var(--accent)}
.hero-card .ib{background:#fff}

/* 부탁 카드 */
.asks{background:var(--yellow);border-radius:22px;padding:16px;display:grid;gap:10px}
.asks .sec-title{margin:0}
.ask-row{display:flex;gap:12px;align-items:center;background:#fff;border-radius:16px;padding:12px}
.ask-row .t{flex:1;min-width:0}
.ask-row .t b{display:block}
.ask-row .t span{font-size:13px;color:var(--muted)}
.btn-dark{background:var(--yellow-ink);color:#fff;border:0;border-radius:12px;padding:9px 13px;font-weight:700;white-space:nowrap}

/* 대출 중 */
.loan{background:#fff;border-radius:22px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line)}
.loan-toggle{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;padding:14px 16px;text-align:left}
.loan-toggle h2{font-size:19px}
.loan-toggle .cnt{font-family:var(--f-disp);background:var(--sky);color:var(--sky-ink);border-radius:999px;min-width:28px;text-align:center;padding:1px 9px;font-size:16px}
.loan-toggle .hint{flex:1;color:var(--muted);font-size:13px;text-align:right}
.loan-toggle .chev{transition:transform .2s;color:var(--muted)}
.loan-toggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
.loan-body{padding:0 10px 10px;display:grid;gap:8px}
.loan-head{display:none}
.loan-row{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;background:var(--surface);border-radius:16px}
.loan-row .mini{width:46px;height:62px;border-radius:8px;overflow:hidden}
.loan-row .t{min-width:0}
.loan-row .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loan-row .t span{font-size:12.5px;color:var(--muted)}
.loan-row .acts{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.loan-row .acts div{display:flex;gap:6px}
.loan-empty{padding:4px 8px 8px;color:var(--muted);font-size:14px}

/* 반납 배지 */
.stamp{display:inline-block;border-radius:999px;padding:2px 10px;white-space:nowrap;font-size:12.5px;font-weight:700;background:var(--sky);color:var(--sky-ink)}
.stamp.due-soon{background:var(--yellow);color:var(--yellow-ink)}
.stamp.over{background:var(--pink);color:var(--danger)}
.stamp.read{background:var(--pink);color:var(--pink-ink)}

/* 필터 */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--surface);border-radius:14px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:10px;padding:6px 12px;font-size:14px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 4px rgba(70,50,140,.12)}
.search{flex:1;min-width:150px;border:0;background:var(--surface);border-radius:14px;padding:10px 14px;font-size:16px}
.search::placeholder{color:var(--muted)}

/* 책 카드 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px 14px;margin-top:16px}
.card{display:flex;flex-direction:column;text-align:left;background:none;border:0;padding:0;position:relative;gap:8px}
.cover{aspect-ratio:3/4;width:100%;max-width:100%;background:var(--surface);position:relative;overflow:hidden;border-radius:18px;box-shadow:var(--shadow)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.ph{width:100%;height:100%;background:var(--c,var(--purple));display:flex;flex-direction:column;justify-content:space-between;padding:12px;color:var(--ci,var(--purple-ink));font-family:var(--f-disp);font-size:17px;line-height:1.25}
.ph svg{width:28px;height:28px;opacity:.8}
.ph span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
.card .meta{padding:0 4px;display:grid;gap:3px;min-width:0}
.card .meta b{font-weight:700;font-size:14.5px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .meta span{font-size:12.5px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.card .tag{position:absolute;left:8px;top:8px;display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.92);color:var(--ink);font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px 2px 3px}
.card .tag .dot{width:18px;height:18px;font-size:10px}
.card .cover .stamp{position:absolute;right:8px;top:8px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.card .ph{justify-content:flex-end}
.card .ph svg{display:none}
.loan-row .btn{background:#fff}
.pill{display:inline-block;font-size:12px;border-radius:999px;padding:1px 9px;font-weight:700;justify-self:start;background:var(--sky);color:var(--sky-ink)}
.pill.reading{background:var(--yellow);color:var(--yellow-ink)}
.pill.done{background:var(--pink);color:var(--pink-ink)}
.empty{background:var(--surface);border-radius:22px;padding:30px 18px;text-align:center;color:var(--muted);margin-top:16px;display:grid;gap:10px;justify-items:center}
.empty b{color:var(--ink);font-size:16px}

/* 버튼 */
.btn{border:0;background:var(--surface);border-radius:14px;padding:10px 16px;font-weight:700;display:inline-flex;align-items:center;gap:6px;justify-content:center;text-decoration:none;color:var(--ink);font-size:14.5px}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:11px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--pink);color:var(--danger)}
.btn.ghost{background:none;color:var(--muted)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.fab{position:fixed;z-index:15;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fab .btn{box-shadow:0 8px 22px rgba(90,60,200,.25);padding:14px 20px;border-radius:999px;font-size:15px}
.fab .btn:not(.primary){background:var(--yellow);color:var(--yellow-ink);box-shadow:0 8px 22px rgba(160,120,0,.18)}

/* 탭바 */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(var(--n,3),1fr)}
.tabbar button{border:0;background:none;padding:8px 0 10px;display:grid;justify-items:center;gap:3px;color:var(--muted);font-size:12px;font-weight:500}
.tabbar .ib{width:48px;height:32px;border-radius:999px;background:transparent;color:var(--muted)}
.tabbar .ib svg{width:23px;height:23px}
.tabbar button[aria-current="page"]{color:var(--ink);font-weight:700}
.tabbar button[aria-current="page"] .ib{background:var(--b);color:var(--bi)}

/* 달력 */
.cal-nav{display:flex;align-items:center;gap:10px}
.cal-nav h2{font-size:22px;min-width:130px;text-align:center;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.stat{border-radius:20px;padding:14px;background:var(--surface)}
.stat:nth-child(1){background:var(--pink)}.stat:nth-child(2){background:var(--sky)}.stat:nth-child(3){background:var(--yellow)}
.stat .k{font-size:12.5px;color:#5f5a74;font-weight:500}
.stat .v{font-family:var(--f-disp);font-size:30px;line-height:1.2;font-variant-numeric:tabular-nums}
.stat .v small{font-size:15px;margin-left:2px}
.bar{height:9px;border-radius:99px;background:#EFEDF6;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:99px}
.stat .bar{background:rgba(255,255,255,.75)}
.stat .bar i{background:var(--pink-ink)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:16px;background:#fff;border-radius:22px;padding:10px;box-shadow:var(--shadow);border:1px solid var(--line)}
.cal .dow{text-align:center;font-size:12px;color:var(--muted);padding-block:4px;font-weight:700}
.cal .dow:first-child{color:var(--pink-ink)}
.day{min-height:70px;background:none;border:0;border-radius:12px;padding:4px;display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0;align-items:stretch}
.day.blank{pointer-events:none}
.day .n{font-size:12.5px;font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;gap:2px;align-items:center}
.day.today .n span{background:var(--accent);color:#fff;border-radius:999px;padding:0 7px;font-weight:700}
.day .due{width:7px;height:7px;border-radius:50%;background:var(--danger);font-size:0}
.day .covers{display:flex;flex-wrap:wrap;gap:2px}
.day .covers i{width:18px;height:24px;border-radius:4px;background:var(--c,#ddd) center/cover no-repeat;display:block}
.day .more{font-size:11px;color:var(--muted)}
.day.has{background:var(--pink)}
.day[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent)}
.list{display:grid;gap:8px;margin-top:10px}
.li{display:flex;align-items:center;gap:12px;background:var(--surface);border:0;border-radius:16px;padding:10px 12px;text-align:left;width:100%}
.li .mini{width:38px;height:52px;border-radius:7px;overflow:hidden;flex:none}
.mini img{width:100%;height:100%;object-fit:cover;display:block}
.mini .ph{font-size:8px;padding:4px}
.mini .ph svg{width:12px;height:12px}
.li .t{flex:1;min-width:0}
.li .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .t span{font-size:13px;color:var(--muted)}

/* 가족 */
.rank{display:grid;gap:10px;margin-top:14px}
.rk{display:grid;grid-template-columns:30px 48px minmax(0,1fr) auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:20px;padding:12px 14px}
.rk .pos{font-family:var(--f-disp);font-size:19px;color:var(--muted);text-align:center;display:grid;place-items:center}
.rk .pos svg{width:28px;height:28px}
.rk .av{width:48px;height:48px;border-radius:50%;background:var(--c);color:var(--ci);display:grid;place-items:center;font-family:var(--f-disp);font-size:20px}
.rk .who{display:flex;align-items:baseline;gap:6px;font-weight:700}
.rk .who small{font-weight:400;color:var(--muted);font-size:12px}
.rk .bar i{background:var(--ci)}
.rk .num{font-family:var(--f-disp);font-size:28px;font-variant-numeric:tabular-nums;text-align:right;line-height:1}
.rk .num small{font-size:12px;color:var(--muted);display:block;font-family:var(--f-body);margin-top:4px}
.feed{display:grid;gap:8px;margin-top:10px}
.cheer{border:0;background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;display:inline-flex;gap:4px;align-items:center;white-space:nowrap;color:var(--pink-ink);font-weight:700;box-shadow:0 1px 4px rgba(70,50,140,.1)}
.cheer[aria-pressed="true"]{background:var(--pink-ink);color:#fff}
.codebox{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--purple);border-radius:20px;padding:14px 16px;margin-top:20px}
.codebox .code{font-family:var(--f-mono);font-size:22px;letter-spacing:.14em;color:var(--purple-ink)}
.codebox .btn{background:#fff}

/* 시트 */
#sheetWrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(40,30,70,.35)}
.sheet{position:relative;background:#fff;width:100%;max-width:600px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:28px 28px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));box-shadow:0 -10px 40px rgba(40,30,70,.2)}
.sheet::before{content:"";display:block;width:42px;height:5px;border-radius:9px;background:#E2DFEC;margin:0 auto 12px}
@media (min-width:700px){#sheetWrap{align-items:center}.sheet{border-radius:28px;padding:14px 26px 24px}}
.sheet-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sheet-h h2{flex:1;font-size:23px}
.form{display:grid;gap:12px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:420px){.row2.stack{grid-template-columns:1fr}}
label.f,.f{display:grid;gap:5px;font-size:13px;color:var(--muted);min-width:0;font-weight:500}
.f input,.f select,.f textarea,.inp{width:100%;border:1.5px solid transparent;background:var(--surface);border-radius:14px;padding:10px 12px;font-size:16px;color:var(--ink);min-width:0;font-weight:400}
.f input:focus,.f select:focus,.f textarea:focus,.inp:focus{border-color:var(--accent);background:#fff;outline:none}
.f textarea{resize:vertical}
.paste{background:var(--sky);border-radius:20px;padding:14px;display:grid;gap:8px}
.paste .ttl{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px}
.paste .ttl .ib{width:30px;height:30px;border-radius:10px;background:#fff}
.paste .ttl .ib svg{width:18px;height:18px}
.paste textarea{min-height:84px;font-family:var(--f-mono);font-size:13.5px;width:100%;border:0;background:#fff;border-radius:14px;padding:10px 12px;resize:vertical}
.paste p{margin:0;font-size:13px;color:#4d6a86}
.cover-pick{display:flex;gap:14px;align-items:center}

function dedupeTitle(t){
  t=String(t||'').replace(/\s+/g,' ').trim();
  const w=t.split(' ');
  for(let n=1;n<=w.length/2;n++){ // "A B A B" -> "A B"
    if(w.length%n===0){const u=w.slice(0,n).join(' ');let ok=true;for(let i=n;i<w.length;i+=n){if(w.slice(i,i+n).join(' ')!==u){ok=false;break}}if(ok&&w.length>n)return u}
  }
  const h=t.length/2; if(Number.isInteger(h)&&t.slice(0,h)===t.slice(h))return t.slice(0,h).trim();
  return t;
}

function splitPeople(s){
  const au=[],il=[];
  String(s).split(/[;；,]/).map(x=>x.trim()).filter(Boolean).forEach(p=>{

  });
  return {author:au.filter(Boolean).join(', '),illustrator:il.filter(Boolean).join(', ')};

  return `<span class="stamp ${d<=2?'due-soon':''}">반납 D-${d}</span>`;
}
function statusLabel(b){return b.status==='done'?'다 읽음':b.status==='reading'?'읽는 중':(isHome(b)?'읽을 책':'빌려올 책')}

function calView(){
  const ids=viewIds();const showOwner=ids.length>1;
  const [y,mo]=S.calMonth.split('-').map(Number);
  const first=new Date(y,mo-1,1);const startDow=first.getDay();const daysIn=new Date(y,mo,0).getDate();
  const mine=S.books.filter(b=>ids.includes(b.memberId)&&shown(b));
  const done=mine.filter(b=>b.status==='done'&&b.doneAt);
  const inMonth=done.filter(b=>b.doneAt.startsWith(S.calMonth));
  const byDay={};inMonth.forEach(b=>{(byDay[b.doneAt]=byDay[b.doneAt]||[]).push(b)});
  const dues={};mine.filter(onLoan).forEach(b=>{(dues[b.loan.due]=dues[b.loan.due]||[]).push(b)});
  const yearCnt=done.filter(b=>b.doneAt.startsWith(String(y))).length;
  const goal=ids.reduce((s,id)=>s+(+memberOf(id)?.goal||0),0);
  const pct=goal?Math.min(100,Math.round(inMonth.length/goal*100)):0;
  const td=today();
  let cells='';
  ['일','월','화','수','목','금','토'].forEach(d=>cells+=`<div class="dow">${d}</div>`);
  for(let i=0;i<startDow;i++) cells+=`<div class="day blank"></div>`;
  for(let d=1;d<=daysIn;d++){
    const ds=`${y}-${pad(mo)}-${pad(d)}`;const bs=byDay[ds]||[];const du=dues[ds]||[];
    const covers=bs.slice(0,3).map(b=>{const img=safeImg(b.cover);const c=safeColor(memberOf(b.memberId)?.color);return `<i style="--c:${c};${img?`background-image:url('${img}')`:''}"></i>`}).join('');
    cells+=`<button class="day ${ds===td?'today':''} ${bs.length?'has':''}" data-act="day" data-id="${ds}" aria-pressed="${S.calDay===ds}" aria-label="${mo}월 ${d}일, ${bs.length}권 읽음${du.length?', 반납일':''}">
      <span class="n"><span>${d}</span>${du.length?'<span class="due">반납</span>':''}</span>
      ${bs.length?`<span class="covers">${covers}</span>${bs.length>3?`<span class="more">+${bs.length-3}</span>`:''}`:''}</button>`;
  }
  const sel=S.calDay&&S.calDay.startsWith(S.calMonth)?S.calDay:null;
  const selList=sel?[...(byDay[sel]||[]).map(b=>({b,k:'read'})),...(dues[sel]||[]).map(b=>({b,k:'due'}))]:[];
  return `${viewbar()}
  <div class="sec-h sec"><div class="cal-nav"><button class="icon-btn" data-act="cal-prev" aria-label="이전 달">‹</button><h2>${y}년 ${mo}월</h2><button class="icon-btn" data-act="cal-next" aria-label="다음 달">›</button></div>
  ${S.calMonth!==td.slice(0,7)?`<button class="btn sm" data-act="cal-today">이번 달</button>`:''}</div>
  <div class="stats">
    <div class="stat"><div class="k">${mo}월에 읽은 책</div><div class="v">${inMonth.length}<small>권</small></div>${goal?`<div class="bar"><i style="width:${pct}%"></i></div><div class="k">목표 ${goal}권 · ${pct}%</div>`:''}</div>
    <div class="stat"><div class="k">${y}년 한 해</div><div class="v">${yearCnt}<small>권</small></div></div>
    <div class="stat"><div class="k">지금까지</div><div class="v">${done.length}<small>권</small></div></div>
  </div>
  <div class="cal" role="grid">${cells}</div>
  <p class="note" style="margin-top:8px">다 읽은 날에 표지가 붙어요. 빨간 '반납'은 반납일이에요. 날짜를 누르면 목록이 보여요.</p>
  ${sel?`<section class="sec"><h2 style="font-size:18px">${md(sel)} 기록</h2><div class="list">${selList.length?selList.map(({b,k})=>`<button class="li" data-act="open" data-id="${esc(b.id)}"><div class="mini">${coverHTML(b)}</div><div class="t"><b>${esc(b.title)}</b><span>${showOwner?esc(memberOf(b.memberId)?.name||'')+' · ':''}${k==='read'?(b.rating?'★'.repeat(Math.min(5,+b.rating||0))+' ':'')+(b.memo?esc(b.memo):'다 읽음'):'반납일'}</span></div>${k==='due'?'<span class="stamp over">반납</span>':'<span class="stamp read">읽음</span>'}</button>`).join(''):'<p class="note">이날은 기록이 없어요.</p>'}</div></section>`:''}
  ${badgeSection(ids)}`;
}
function badgeSection(ids){
  if(ids.length!==1) return `<section class="sec"><div class="sec-title">${ib('medal','yellow')}<h2>배지</h2></div><p class="note">위에서 한 사람을 고르면 그 사람의 배지가 보여요.</p></section>`;
  const m=memberOf(ids[0]);const total=doneCount(ids[0]);
  const months={};S.books.forEach(b=>{if(b.memberId===ids[0]&&b.status==='done'&&b.doneAt){const k=b.doneAt.slice(0,7);months[k]=(months[k]||0)+1}});
  const goalHit=m?.goal?Object.values(months).filter(n=>n>=m.goal).length:0;
  const next=BADGES.find(([n])=>total<n);
  return `<section class="sec"><div class="sec-title">${ib('medal','yellow')}<h2 style="flex:1">${esc(m?.name||'')}의 배지</h2><span class="note">${next?`다음 배지까지 ${next[0]-total}권`:'모든 배지를 모았어요!'}</span></div>
  <div class="badges">${BADGES.map(([n,name,tone])=>{const on=total>=n;return `<div class="badge ${on?'on':''}">${medal(n,tone,on)}<b>${name}</b><span>${n}권</span></div>`}).join('')}
  <div class="badge ${goalHit?'on':''}">${medal(goalHit,'yellow',goalHit>0)}<b>목표 달성</b><span>${m?.goal?`목표 채운 달 ${goalHit}번`:'목표를 정해 주세요'}</span></div></div></section>`;
}

function famView(){

  let rank=0,prev=null;
  return `<div class="sec-h sec"><div class="cal-nav"><button class="icon-btn" data-act="fam-prev" aria-label="이전 달">‹</button><h2>${y}년 ${mo}월</h2><button class="icon-btn" data-act="fam-next" aria-label="다음 달">›</button></div></div>

/* 작성 중인 내용 보관: 사진 찍다가 앱이 다시 열려도 되살림 */
const Draft={key:'gbs-draft',t:null,pending:null,
  get(){try{return JSON.parse(localStorage.getItem(this.key)||'null')}catch(e){return null}},
  put(d){this.pending=d;clearTimeout(this.t);this.t=setTimeout(()=>this.flush(),300)},
  flush(){clearTimeout(this.t);if(!this.pending)return;try{localStorage.setItem(this.key,JSON.stringify(this.pending))}catch(e){}this.pending=null},
  clear(){clearTimeout(this.t);this.pending=null;try{localStorage.removeItem(this.key)}catch(e){}}};
document.addEventListener('visibilitychange',()=>{if(document.hidden)Draft.flush()});
window.addEventListener('pagehide',()=>Draft.flush());
const Last={key:'gbs-lastsheet',set(v){try{sessionStorage.setItem(this.key,JSON.stringify(v))}catch(e){}},get(){try{return JSON.parse(sessionStorage.getItem(this.key)||'null')}catch(e){return null}},clear(){try{sessionStorage.removeItem(this.key)}catch(e){}}};
function formFields(root){const o={};root.querySelectorAll('input[id],textarea[id],select[id]').forEach(el=>{if(el.type==='file'||el.id==='f-paste')return;o[el.id]=el.type==='checkbox'?el.checked:el.value});return o}
function fillFields(root,o){Object.entries(o||{}).forEach(([k,v])=>{const el=root.querySelector('#'+CSS.escape(k));if(!el||el.disabled)return;if(el.type==='checkbox')el.checked=!!v;else el.value=v;el.dispatchEvent(new Event('change',{bubbles:true}))})}
function restoreSession(){
  const d=Draft.get();
  if(d&&d.code===S.code&&d.me===S.me&&$('#sheetWrap').hidden){
    if(d.tab&&d.tab!==S.tab){S.tab=d.tab;render()}
    if(d.kind==='book'){openBook(d.id||null,d.preset||null,d);toast('작성하던 내용을 되살렸어요');return}
    if(d.kind==='series'){openSeriesForm(null,d);toast('작성하던 내용을 되살렸어요');return}
  }
  const l=Last.get();

function openSheet(html,mount){sheetRefresh=null;Last.clear();$('#sheet').innerHTML=html;$('#sheetWrap').hidden=false;document.body.style.overflow='hidden';$('#sheet').scrollTop=0;mount&&mount($('#sheet'))}
function closeSheet(){sheetRefresh=null;Draft.clear();Last.clear();$('#sheetWrap').hidden=true;$('#sheet').innerHTML='';document.body.style.overflow=''}
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}

const COVER_MAX=200;
function shrinkImg(src,revoke){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const s=Math.min(1,COVER_MAX/Math.max(w,h));w=Math.max(1,Math.round(w*s));h=Math.max(1,Math.round(h*s));const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);if(revoke)URL.revokeObjectURL(src);let data=c.toDataURL('image/webp',0.6);if(!data.startsWith('data:image/webp'))data=c.toDataURL('image/jpeg',0.62);res(data)};img.onerror=()=>{if(revoke)URL.revokeObjectURL(src);rej(new Error('img'))};img.src=src})}
async function compressImage(file){const data=await shrinkImg(URL.createObjectURL(file),true);return {data,blob:file}}
async function shrinkDataUrl(u){if(!safeImg(u)||u.length<9000)return u;try{return await shrinkImg(u,false)}catch(e){return u}}
function dataUrlToBlob(u){const [h,b]=u.split(',');const bin=atob(b);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:h.match(/data:(.*?);/)[1]})}

function libOptions(sel){return S.libs.map(l=>`<option value="${esc(l.id)}" ${l.id===sel?'selected':''}>${esc(l.name)} (${LIBTYPES[l.type]||'기타'})</option>`).join('')+`<option value="__new">+ 새 도서관 추가…</option>`}

function openBook(id,preset,draft){
  const b=id?S.books.find(x=>x.id===id):null;
  if(id&&!b) return;
  const canEdit=!b||isParent()||b.memberId===S.me;
  const parent=isParent();
  let cover=b?safeImg(b.cover):'';let coverBlob=null;let rating=b?.rating||0;let status=b?.status||'want';
  if(draft){if(draft.cover!==undefined)cover=safeImg(draft.cover);if(draft.rating!==undefined)rating=draft.rating;if(draft.status)status=draft.status;if(draft.targets)preset={...(preset||{}),memberIds:draft.targets}}
  const pm=preset?.memberIds||(preset?.memberId?[preset.memberId]:null);
  const targets=new Set(b?[b.memberId]:(pm?pm:(parent?(S.view!=='all'&&memberOf(S.view)?[S.view]:[]):[S.me])));
  const defaultLib=b?.libId||(preset?.libId&&S.libs.some(l=>l.id===preset.libId)?preset.libId:null)||(S.libs.find(l=>l.type!=='home')||S.libs[0])?.id||'__new';
  const hiddenOn=b?!!b.hidden:!!preset?.hidden;
  const loanOn=b?onLoan(b):false;
  const quick=b?`<div class="box"><div class="actions">

      ${b.status!=='done'?`<button class="btn sm" data-act="mark-done" data-id="${esc(b.id)}">다 읽었어요</button>`:''}
      ${b.status==='want'?`<button class="btn sm" data-act="mark-reading" data-id="${esc(b.id)}">읽기 시작</button>`:''}
      ${parent?`<button class="btn sm" data-act="copy" data-id="${esc(b.id)}" style="background:var(--purple);color:var(--purple-ink)">다른 사람에게도 넣기</button>`:''}
      ${parent&&!isHome(b)&&!onLoan(b)&&b.status!=='done'?`<button class="btn sm" data-act="ask" data-id="${esc(b.memberId)}" data-book="${esc(b.id)}">빌려와 줘 문자</button>`:''}
    </div></div>`:'';
  const ro=canEdit?'':'disabled';
  const html=`<div class="sheet-h"><h2>${b?esc(b.title):hiddenOn?'미리 담기':'책 추가'}</h2><button class="icon-btn" data-act="close-sheet" aria-label="닫기">${ICON.x}</button></div>
  <form class="form" id="book-form">
    ${quick}
    ${!b&&parent?`<div class="f" style="display:grid;gap:6px;font-size:13px;color:var(--muted)">누구 책장에 넣을까요? (여러 명 골라도 돼요)<div class="viewbar" style="padding:0;flex-wrap:wrap">${S.members.map(m=>`<button type="button" class="chip" data-tg="${esc(m.id)}" aria-pressed="${targets.has(m.id)}"><span class="dot" style="${cv(m.color)}"></span>${esc(m.name)}</button>`).join('')}</div></div>`:''}
    ${parent?`<label class="check" style="background:var(--yellow);border-radius:14px;padding:10px 12px"><input type="checkbox" id="f-hidden" ${hiddenOn?'checked':''}> 담아두기 (아이 화면에는 아직 안 보여요)</label>`:''}
    ${seriesOf(b)?`<p class="note">전집 '${esc(seriesOf(b).name)}' ${b.seriesNo?b.seriesNo+'번':''}</p>`:''}
    ${b&&parent?`<label class="f">누구 책인가요<select id="f-member">${S.members.map(m=>`<option value="${esc(m.id)}" ${m.id===b.memberId?'selected':''}>${esc(m.name)}</option>`).join('')}</select></label>`:''}
    ${canEdit?`<div class="paste"><div class="ttl">${ib('clip','sky')}도서관 검색 결과 붙여넣기</div><p>도서관 홈페이지의 책 정보를 통째로 복사해 붙여넣으면 칸이 자동으로 채워져요. 표 모양, '저자: …' 모양 둘 다 돼요.</p><textarea id="f-paste" placeholder="예) 하하 자매 떡집   도서관명 소장위치 청구기호 …&#10;또는) 저자: 김리리 지음;김이랑 그림 출판사: 비룡소 …"></textarea><div class="actions"><button type="button" class="btn sm primary" id="do-parse">칸 채우기</button><span class="note" id="parse-msg"></span></div></div>`:''}
    <div class="cover-pick"><div class="prev" id="cv-prev">${cover?`<img src="${cover}" alt="표지">`:'표지<br>사진'}</div>
      ${canEdit?`<div class="btns"><label class="btn sm file-btn">표지 사진 넣기<input type="file" id="f-cover" accept="image/*"></label><button type="button" class="btn sm" id="ai-cover" hidden>표지 글자로 칸 채우기</button>${cover?`<button type="button" class="btn sm ghost" id="rm-cover">사진 빼기</button>`:''}<span class="note" id="ai-msg"></span></div>`:''}</div>
    <label class="f">제목 *<input id="f-title" value="${esc(b?.title||'')}" required ${ro}></label>

      <div id="libfields">

      <div class="row2 stack" style="margin-top:10px"><label class="f">청구기호<input id="f-call" class="mono" value="${esc(b?.callNo||'')}" ${ro}></label><label class="f">등록번호<input id="f-reg" class="mono" value="${esc(b?.regNo||'')}" ${ro}></label></div>
      <label class="check" style="margin-top:10px"><input type="checkbox" id="f-loan" ${loanOn?'checked':''} ${ro}> 지금 빌려 온 상태예요</label>
      <div class="row2" id="loanrow" ${loanOn?'':'hidden'}><label class="f">빌린 날<input type="date" id="f-loanat" value="${esc(b?.loan?.at||today())}" ${ro}></label><label class="f">반납 예정일<input type="date" id="f-due" value="${esc(b?.loan?.due||addDays(today(),LOAN_DAYS))}" ${ro}></label></div>
      </div>
    </div>
    <div class="box"><h3>읽기</h3>
      <div class="seg" role="group" aria-label="읽기 상태" id="f-status">${[['want','읽을 책'],['reading','읽는 중'],['done','다 읽음']].map(([k,l])=>`<button type="button" data-st="${k}" aria-pressed="${status===k}" ${ro}>${l}</button>`).join('')}</div>
      <label class="f" id="donerow" ${status==='done'?'':'hidden'}>다 읽은 날<input type="date" id="f-doneat" value="${esc(b?.doneAt||today())}" ${ro}></label>
      <div class="f">별점<div class="stars" id="f-stars">${[1,2,3,4,5].map(n=>`<button type="button" data-star="${n}" class="${n<=rating?'on':''}" aria-label="${n}점" ${ro}>★</button>`).join('')}</div></div>
      <label class="f">한 줄 느낌<textarea id="f-memo" rows="2" placeholder="가장 재미있었던 장면은?" ${ro}>${esc(b?.memo||'')}</textarea></label>
    </div>
    <p class="err" id="f-err" hidden></p>
    ${canEdit?`<div class="sheet-foot">${b?`<button type="button" class="btn danger" id="del-btn">지우기</button><span style="flex:1"></span>`:''}<button type="button" class="btn" data-act="close-sheet">닫기</button>${!b?`<button type="submit" class="btn" id="save-more" style="background:var(--purple);color:var(--purple-ink)">저장하고 하나 더</button>`:''}<button type="submit" class="btn primary">저장</button></div>`:`<p class="note">다른 가족의 책은 볼 수만 있어요.</p>`}
  </form>`;
  openSheet(html,root=>{
    if(!canEdit) return;
    const f=id=>root.querySelector('#'+id);
    const saveDraft=()=>{if(!document.body.contains(f('book-form')))return;Draft.put({kind:'book',tab:S.tab,code:S.code,me:S.me,id:b?.id||null,preset:preset||null,fields:formFields(root),cover,rating,status,targets:[...targets]})};
    const syncLib=()=>{const v=f('f-lib').value;f('newlib').hidden=v!=='__new';const t=v==='__new'?f('f-libtype').value:(S.libs.find(l=>l.id===v)?.type);f('libfields').querySelectorAll('#f-loan,#loanrow').forEach(()=>{});f('f-loan').closest('label').hidden=t==='home';if(t==='home'){f('loanrow').hidden=true}else{f('loanrow').hidden=!f('f-loan').checked}};
    f('f-lib').addEventListener('change',syncLib);f('f-libtype').addEventListener('change',syncLib);syncLib();
    f('f-loan').addEventListener('change',()=>{f('loanrow').hidden=!f('f-loan').checked});
    f('f-loanat').addEventListener('change',()=>{if(f('f-loanat').value)f('f-due').value=addDays(f('f-loanat').value,LOAN_DAYS)});
    root.querySelectorAll('[data-tg]').forEach(el=>el.addEventListener('click',()=>{const k=el.dataset.tg;targets.has(k)?targets.delete(k):targets.add(k);el.setAttribute('aria-pressed',targets.has(k))}));
    f('f-status').addEventListener('click',e=>{const x=e.target.closest('[data-st]');if(!x)return;status=x.dataset.st;f('f-status').querySelectorAll('[data-st]').forEach(y=>y.setAttribute('aria-pressed',y.dataset.st===status));f('donerow').hidden=status!=='done'});

    const fill=p=>{
      const map={title:'f-title',author:'f-author',illustrator:'f-illus',publisher:'f-pub',year:'f-year',location:'f-loc',availability:'f-avail',callNo:'f-call',regNo:'f-reg'};

        if(hit){f('f-lib').value=hit.id}else{f('f-lib').value='__new';f('f-libname').value=p.library;f('f-libtype').value=/학교/.test(p.library)?'school':'public'}
        syncLib();n++;

      return n;
    };
    const runParse=()=>{const p=parseBookText(f('f-paste').value);const n=fill(p);f('parse-msg').textContent=n?`${n}개 칸을 채웠어요. 맞는지 확인해 주세요.`:'알아볼 수 있는 내용이 없어요. 직접 입력해 주세요.';
      if(p.library&&f('f-lib').value==='__new') f('parse-msg').textContent+=` '${p.library}'은(는) 저장할 때 도서관 목록에 추가돼요.`};
    f('do-parse').addEventListener('click',runParse);

      f('ai-msg').textContent='표지를 읽는 중이에요…';f('ai-cover').disabled=true;

        const r=await S.sample.json('이 사진은 책의 앞표지입니다. 표지에 실제로 보이는 글자만 읽어서 JSON 하나로만 답하세요. 형식: {"title":"","author":"","illustrator":"","publisher":""}. 보이지 않거나 확실하지 않은 칸은 빈 문자열로 두세요. "글", "그림", "지음" 같은 말은 이름에서 빼세요.',{images:[blob],modelTier:'quick'});
        const p={};['title','author','illustrator','publisher'].forEach(k=>{if(r&&typeof r[k]==='string'&&r[k].trim())p[k]=r[k].trim().slice(0,120)});
        const map={title:'f-title',author:'f-author',illustrator:'f-illus',publisher:'f-pub'};let n=0;
        for(const k in p){if(!f(map[k]).value.trim()){f(map[k]).value=p[k];n++}}

      }finally{f('ai-cover').disabled=false}
    });

/* 전집 */
function mosaic(x){
  const seen=new Set();const imgs=[];
  S.books.filter(b=>b.seriesId===x.id).sort((a,b)=>(a.seriesNo||0)-(b.seriesNo||0)).forEach(b=>{const u=safeImg(b.cover);if(u&&!seen.has(b.seriesNo)&&imgs.length<4){seen.add(b.seriesNo);imgs.push(u)}});
  if(!imgs.length) return `<div class="ph" style="--c:var(--purple);--ci:var(--purple-ink)">${ICON.sets}<span>${esc(x.name)}</span></div>`;
  return `<div class="mosaic n${imgs.length}">${imgs.map(u=>`<img src="${u}" alt="">`).join('')}</div>`;
}
function parseTitles(txt,start){
  let no=start;
  return String(txt||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    const m=l.match(/^(\d{1,3})\s*(?:[.)\]:\-권번]|\s)\s*(.+)$/);
    if(m){no=+m[1];return {no:no++,title:m[2].trim()}}
    return {no:no++,title:l};
  }).filter(x=>x.title);
}
async function addSeriesBooks(x,items,memberIds,progress){
  const lib=S.libs.find(l=>l.id===x.libId)||S.libs.find(l=>l.type==='home');
  const now=new Date().toISOString();const jobs=[];
  for(const mid of memberIds) for(const it of items) jobs.push({mid,it});
  let done=0,ok=true;
  for(let i=0;i<jobs.length;i+=8){
    const chunk=jobs.slice(i,i+8);
    const res=await Promise.all(chunk.map(({mid,it})=>write(()=>Store.set(base()+'/books/'+uid(),{
      title:it.title,author:'',illustrator:'',publisher:x.publisher||'',year:'',libId:lib?.id||'',libName:lib?.name||'우리집 책장',libType:'home',
      location:'',availability:'',callNo:'',regNo:'',cover:'',status:'want',doneAt:'',rating:0,memo:'',loan:null,ask:null,cheers:{},hidden:false,
      seriesId:x.id,seriesNo:it.no,memberId:mid,createdAt:now,updatedAt:now,addedBy:S.me}))));
    done+=chunk.length;if(res.includes(false))ok=false;progress&&progress(done,jobs.length);
  }
  return ok;
}
async function ensureHomeLib(){
  let l=S.libs.find(x=>x.type==='home');if(l)return l.id;
  const id=uid();await write(()=>Store.set(base()+'/libs/'+id,{name:'우리집 책장',type:'home',createdAt:new Date().toISOString()}));return id;
}

      openSeries(sid);

    f('cp-go').addEventListener('click',async()=>{

      f('cp-go').disabled=true;const now=new Date().toISOString();let made=0,skip=0;
      for(const mid of tg){

          if(b.memberId===mid){skip++;continue}

        }
      }
      const names=[...tg].map(id=>memberOf(id)?.name).join(', ');
      toast(`${names}에게 ${made}권 넣었어요${skip?` (이미 있는 ${skip}권은 건너뜀)`:''}`);
      S.prepSel.clear();closeSheet();render();

}

/* 빌려와 줘 문자 */
function openAsk(memberId,bookId){
  const bookIds=Array.isArray(bookId)?bookId:(bookId?[bookId]:[]);
  const kidsList=S.members.filter(m=>m.id!==S.me);
  let to=memberId&&memberOf(memberId)?memberId:(S.view!=='all'&&memberOf(S.view)&&S.view!==S.me?S.view:(kids()[0]?.id||kidsList[0]?.id));
  let picked=new Set(bookIds);let dirty=false;
  const cands=()=>S.books.filter(b=>b.memberId===to&&!onLoan(b)&&!isHome(b)&&b.status!=='done');
  const text=()=>{
    const m=memberOf(to);if(!m)return'';const bs=cands().filter(b=>picked.has(b.id));
    const from=me();const nm=m.name;
    let s=`${nm}${josa(nm,'아','야')}, 도서관에서 책 빌려와 줄래?\n`;
    bs.forEach((b,i)=>{s+=`\n${i+1}) ${b.title}\n   ${libLabel(b)}${b.location?' · '+b.location:''}\n   청구기호 ${b.callNo||'(없음)'}\n`});
    if(!bs.length) s+='\n(아래에서 책을 골라 주세요)\n';
    s+=`\n빌리면 앱에서 '빌렸어요'를 눌러 줘. 반납은 ${LOAN_DAYS}일 뒤야!\n- ${from?.name||''}`;
    return s;
  };
  const html=`<div class="sheet-h"><h2>빌려와 줘 문자</h2><button class="icon-btn" data-act="close-sheet" aria-label="닫기">${ICON.x}</button></div>
  <div class="form askbox">
    <label class="f">누구에게<select id="a-to">${kidsList.map(m=>`<option value="${esc(m.id)}" ${m.id===to?'selected':''}>${esc(m.name)}</option>`).join('')}</select></label>
    <div class="box"><h3>빌려올 책 고르기</h3><div id="a-books" class="list" style="margin:0"></div></div>
    <label class="f">보낼 글 (고쳐도 돼요)<textarea id="a-text"></textarea></label>
    <p class="note" id="a-phone"></p>
    <div class="actions"><button class="btn primary" id="a-copy" type="button">글 복사 + 앱에 부탁 남기기</button><a class="btn" id="a-sms" href="#">문자앱으로 열기</a></div>
    <p class="note">문자앱 열기는 기기에 따라 안 될 수 있어요. 그럴 땐 '글 복사'를 누르고 문자앱에 붙여넣어 주세요. 부탁은 아이 책장 맨 위에도 노란 카드로 보여요.</p>
  </div>`;
  openSheet(html,root=>{
    const f=id=>root.querySelector('#'+id);
    const smsHref=()=>{const m=memberOf(to);const ph=(m?.phone||'').replace(/[^0-9+]/g,'');return `sms:${ph}?&body=${encodeURIComponent(f('a-text').value)}`};
    const draw=()=>{
      const cs=cands();
      f('a-books').innerHTML=cs.length?cs.map(b=>`<label class="li" style="cursor:pointer"><input type="checkbox" data-bk="${esc(b.id)}" ${picked.has(b.id)?'checked':''} style="width:20px;height:20px;accent-color:var(--accent)"><div class="mini">${coverHTML(b)}</div><div class="t"><b>${esc(b.title)}</b><span>${b.hidden?'담아둔 책 · ':''}${esc(libLabel(b))} · <span class="mono">${esc(b.callNo||'청구기호 없음')}</span></span></div></label>`).join(''):`<p class="note">${esc(memberOf(to)?.name||'')}의 책장에 빌려올 책이 없어요. 먼저 '책 추가'로 넣어 주세요.</p>`;
      if(!dirty) f('a-text').value=text();
      const m=memberOf(to);f('a-phone').textContent=m?.phone?`받는 번호: ${m.phone}`:'설정 › 구성원에서 전화번호를 넣으면 문자앱에 번호가 바로 들어가요.';
      f('a-sms').href=smsHref();
    };
    f('a-to').addEventListener('change',()=>{to=f('a-to').value;picked=new Set();dirty=false;draw()});
    f('a-books').addEventListener('change',e=>{const x=e.target.closest('[data-bk]');if(!x)return;x.checked?picked.add(x.dataset.bk):picked.delete(x.dataset.bk);dirty=false;draw()});
    f('a-text').addEventListener('input',()=>{dirty=true;f('a-sms').href=smsHref()});
    const leaveAsk=async()=>{const ids=[...picked];for(const id of ids){await write(()=>Store.update(base()+'/books/'+id,{ask:{by:S.me,at:today(),done:false},status:'want',hidden:false,updatedAt:new Date().toISOString()}))}return ids.length};
    f('a-copy').addEventListener('click',()=>{
      const txt=f('a-text').value;
      const after=async ok=>{const n=await leaveAsk();toast(ok?(n?`복사했어요. 앱에도 ${n}권 부탁을 남겼어요.`:'복사했어요.'):'복사가 안 됐어요. 글을 길게 눌러 복사해 주세요.')};
      try{navigator.clipboard.writeText(txt).then(()=>after(true),()=>{f('a-text').select();after(false)})}catch(e){f('a-text').select();after(false)}
    });
    f('a-sms').addEventListener('click',()=>{f('a-sms').href=smsHref();leaveAsk()});
    draw();
  });
}

/* 데이터 옮기기 */
function exportData(){const strip=a=>a.map(x=>clone(x));return JSON.stringify({app:'family-book-stamp',v:1,code:S.code,exportedAt:new Date().toISOString(),fam:clone(S.fam),members:strip(S.members),libs:strip(S.libs),series:strip(S.series),books:strip(S.books)})}
async function importData(obj,code,progress){
  if(!obj||obj.app!=='family-book-stamp'||!obj.fam) throw new Error('형식이 맞지 않아요');
  const b='fam/'+code;const jobs=[];
  const put=(col,arr)=>(arr||[]).forEach(d=>{const id=String(d.id||'');if(!/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(id))return;const x=clone(d);delete x.id;jobs.push([b+'/'+col+'/'+id,x])});
  put('members',obj.members);put('libs',obj.libs);put('series',obj.series);put('books',obj.books);
  await Store.set(b,{...clone(obj.fam),importedAt:new Date().toISOString()});
  let n=0;
  for(let i=0;i<jobs.length;i+=8){
    await Promise.all(jobs.slice(i,i+8).map(async([p,d])=>{if(d.cover)d.cover=await shrinkDataUrl(d.cover);await Store.set(p,d)}));
    n=Math.min(jobs.length,i+8);progress&&progress(n,jobs.length);
  }
  return jobs.length;
}
function openImport(intoCurrent){
  openSheet(`<div class="sheet-h"><h2>데이터 가져오기</h2><button class="icon-btn" data-act="close-sheet" aria-label="닫기">${ICON.x}</button></div>
  <div class="form">
    <p class="note">예전 앱에서 '내보내기'로 받은 파일을 고르거나, 복사한 글을 붙여넣으세요. 같은 책은 덮어써지고, 표지는 작게 줄여서 넣어요.</p>
    <label class="btn file-btn" style="justify-self:start">파일 고르기<input type="file" id="im-file" accept=".json,application/json,text/plain"></label>
    <label class="f">또는 붙여넣기<textarea class="inp" id="im-text" rows="5" placeholder='{"app":"family-book-stamp", …}'></textarea></label>
    <p class="err" id="im-err" hidden></p><p class="note" id="im-prog"></p>
    <div class="sheet-foot"><button class="btn" data-act="close-sheet" type="button">닫기</button><button class="btn primary" id="im-go" type="button">가져오기</button></div>
  </div>`,root=>{
    const f=k=>root.querySelector('#'+k);
    f('im-file').addEventListener('change',async e=>{const file=e.target.files[0];if(file)f('im-text').value=await file.text()});
    f('im-go').addEventListener('click',async()=>{
      const er=f('im-err');er.hidden=true;let obj;
      try{obj=JSON.parse(f('im-text').value)}catch(e){er.textContent='내용을 읽지 못했어요. 파일 전체를 넣어 주세요.';er.hidden=false;return}
      const code=intoCurrent?S.code:String(obj.code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
      if(!code){er.textContent='가족 코드를 찾지 못했어요.';er.hidden=false;return}
      f('im-go').disabled=true;
      try{const n=await importData(obj,code,(d,t)=>f('im-prog').textContent=`${d} / ${t} 옮기는 중…`);
        toast(`${n}개를 옮겼어요`);closeSheet();if(!intoCurrent){Dev.set({code,me:null});connect(code);render()}}
      catch(e){er.textContent='옮기지 못했어요: '+(e&&e.message||'');er.hidden=false;f('im-go').disabled=false}
    });
  });
}

    const f=id=>root.querySelector('#'+id);
    f('m-color').addEventListener('click',e=>{const x=e.target.closest('[data-c]');if(!x)return;color=x.dataset.c;f('m-color').querySelectorAll('[data-c]').forEach(y=>y.setAttribute('aria-pressed',y.dataset.c===color))});
    f('m-del')?.addEventListener('click',async()=>{const n=S.books.filter(b=>b.memberId===m.id).length;if(n){f('m-err').textContent=`${m.name}의 책이 ${n}권 있어요. 책을 먼저 지우거나 다른 사람에게 옮겨 주세요.`;f('m-err').hidden=false;return}const x=f('m-del');if(!x.dataset.armed){x.dataset.armed='1';x.textContent='한 번 더 누르면 지워져요';return}if(await write(()=>Store.del(base()+'/members/'+m.id),'지웠어요'))openSettings()});
    f('m-form').addEventListener('submit',async e=>{e.preventDefault();const name=f('m-name').value.trim();if(!name)return;
      const data={...(m?clone(m):{order:S.members.length,createdAt:new Date().toISOString()}),name,role:parent?f('m-role').value:(m?.role||'kid'),goal:Math.max(0,parseInt(f('m-goal').value,10)||0),phone:f('m-phone').value.trim(),color};delete data.id;
      if(await write(()=>Store.set(base()+'/members/'+(m?.id||uid()),data),'저장했어요'))openSettings()});
  });
}

/* ---------- 동작 ---------- */
async function bookUpdate(id,patch,msg){const b=S.books.find(x=>x.id===id);if(!b)return;if(!isParent()&&b.memberId!==S.me){toast('다른 가족의 책은 고칠 수 없어요');return}
  await write(()=>Store.update(base()+'/books/'+id,{...patch,updatedAt:new Date().toISOString()}),msg);if(!$('#sheetWrap').hidden&&$('#book-form'))closeSheet()}
const ACT={
  'close-sheet':()=>closeSheet(),
  tab:el=>{S.tab=el.dataset.id;window.scrollTo(0,0);render()},
  view:el=>{S.view=el.dataset.id;S.calDay=null;render()},
  filter:el=>{S.filter=el.dataset.id;render()},
  'loan-toggle':()=>{S.loanOpen=!S.loanOpen;try{localStorage.setItem('gbs-loanopen',S.loanOpen?'1':'0')}catch(e){}render()},
  add:()=>openBook(null),
  open:el=>openBook(el.dataset.id),
  ask:el=>openAsk(el.dataset.id,el.dataset.book),
  settings:()=>openSettings(),
  member:el=>openMember(el.dataset.id),
  'loan-now':el=>{const b=S.books.find(x=>x.id===el.dataset.id);if(!b)return;const t=today();const p={loan:{at:t,due:addDays(t,LOAN_DAYS),returned:false},hidden:false};if(b.status==='want')p.status='reading';if(b.ask)p.ask={done:true};bookUpdate(b.id,p,`빌렸어요. 반납일은 ${md(addDays(t,LOAN_DAYS))}이에요.`)},
  return:el=>bookUpdate(el.dataset.id,{loan:{returned:true,returnedAt:today()}},'반납 완료!'),
  extend:el=>{const b=S.books.find(x=>x.id===el.dataset.id);if(b&&b.loan)bookUpdate(b.id,{loan:{due:addDays(b.loan.due,LOAN_DAYS)}},`반납일을 ${md(addDays(b.loan.due,LOAN_DAYS))}로 미뤘어요`)},
  'mark-done':el=>openDone(el.dataset.id),
  series:el=>openSeries(el.dataset.id),
  'series-new':()=>openSeriesForm(null),
  'prep-for':el=>{S.prepFor=el.dataset.id;S.prepSel.clear();S.prepDelArmed=false;render()},
  'prep-add':()=>openBook(null,{memberIds:S.prepFor?[S.prepFor]:[],hidden:true}),
  'prep-all':()=>{const list=S.books.filter(b=>b.hidden&&b.memberId===S.prepFor);if(S.prepSel.size===list.length)S.prepSel.clear();else list.forEach(b=>S.prepSel.add(b.id));render()},
  'prep-send':async()=>{const ids=[...S.prepSel];if(!ids.length)return;const now=new Date().toISOString();let n=0;for(const id of ids){if(await write(()=>Store.update(base()+'/books/'+id,{hidden:false,updatedAt:now})))n++}S.prepSel.clear();toast(`${n}권을 ${memberOf(S.prepFor)?.name||''} 책장으로 보냈어요`);render()},
  'prep-copy':()=>{const ids=[...S.prepSel];if(ids.length)openCopy(ids)},
  copy:el=>openCopy([el.dataset.id]),
  'prep-ask':()=>{const ids=[...S.prepSel];if(!ids.length)return;openAsk(S.prepFor,ids)},
  'prep-del':async()=>{const ids=[...S.prepSel];if(!ids.length)return;if(!S.prepDelArmed){S.prepDelArmed=true;render();return}S.prepDelArmed=false;for(const id of ids){await write(()=>Store.del(base()+'/books/'+id))}S.prepSel.clear();toast(`${ids.length}권을 지웠어요`);render()},
  'mark-reading':el=>bookUpdate(el.dataset.id,{status:'reading'},'읽기 시작!'),
  cheer:el=>{const b=S.books.find(x=>x.id===el.dataset.id);if(!b)return;const on=!(b.cheers||{})[S.me];write(()=>Store.update(base()+'/books/'+b.id,{cheers:{[S.me]:on}}),on?'응원을 보냈어요':'')},
  day:el=>{S.calDay=S.calDay===el.dataset.id?null:el.dataset.id;render()},
  'cal-prev':()=>{S.calMonth=shiftMonth(S.calMonth,-1);S.calDay=null;render()},
  'cal-next':()=>{S.calMonth=shiftMonth(S.calMonth,1);S.calDay=null;render()},
  'cal-today':()=>{S.calMonth=today().slice(0,7);render()},
  'fam-prev':()=>{S.famMonth=shiftMonth(S.famMonth,-1);render()},
  'fam-next':()=>{S.famMonth=shiftMonth(S.famMonth,1);render()},
  'copy-code':()=>{try{navigator.clipboard.writeText(S.code).then(()=>toast('가족 코드를 복사했어요'),()=>toast('코드: '+S.code))}catch(e){toast('코드: '+S.code)}},
  switch:()=>{closeSheet();const cur=me();if(cur&&cur.role==='kid'&&S.fam.pin){S.pinFor='__switch'}Dev.set({code:S.code,me:null});S.me=null;S.view='all';S.tab='shelf';render()},
  pick:el=>{const m=memberOf(el.dataset.id);if(!m)return;const needPin=S.fam.pin&&(S.pinFor==='__switch'||m.role==='parent');if(needPin){S.pinFor=m.id;render();setTimeout(()=>$('#pin-in')?.focus(),30);return}choose(m.id)},
  'pin-cancel':()=>{S.pinFor=null;render()},
  leave:()=>{closeSheet();unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];Dev.set({});S.code=null;S.me=null;S.fam=undefined;S.err=null;S.pinFor=null;render()},
  'import-new':()=>openImport(false),
  'new-member-row':()=>{$('#new-members').insertAdjacentHTML('beforeend',newMemberRow())}
};
function choose(id){S.me=id;S.pinFor=null;S.view=memberOf(id)?.role==='parent'?'all':id;Dev.set({code:S.code,me:id});render()}
function shiftMonth(ym,n){const [y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+n,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`}

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const fn=ACT[el.dataset.act];if(!fn)return;if(el.tagName==='BUTTON'||el.tagName==='DIV')e.preventDefault();fn(el,e)});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;render()}});
document.addEventListener('change',e=>{const x=e.target.closest&&e.target.closest('[data-prepsel]');if(!x)return;x.checked?S.prepSel.add(x.dataset.prepsel):S.prepSel.delete(x.dataset.prepsel);S.prepDelArmed=false;render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheetWrap').hidden)closeSheet()});
document.addEventListener('submit',async e=>{
  if(e.target.id==='join-form'){e.preventDefault();const code=$('#join-code').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');const er=$('#join-err');if(!code){er.textContent='코드를 적어 주세요.';er.hidden=false;return}
    let ok=null;try{ok=await Store.get('fam/'+code)}catch(x){er.textContent='지금은 확인할 수 없어요. 잠시 뒤 다시 해 주세요.';er.hidden=false;return}
    if(!ok){er.textContent='이 코드로 만든 가족이 없어요.';er.hidden=false;return}
    Dev.set({code,me:null});connect(code);render()}
  if(e.target.id==='new-form'){e.preventDefault();
    const names=[...document.querySelectorAll('#new-members > div')].map(r=>({name:r.querySelector('.nm-name').value.trim(),role:r.querySelector('.nm-role').value})).filter(x=>x.name);
    if(!names.length){toast('구성원을 한 명 이상 적어 주세요');return}
    const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let code='';for(let i=0;i<6;i++)code+=A[Math.floor(Math.random()*A.length)];
    const now=new Date().toISOString();
    const ok=await write(async()=>{
      await Store.set('fam/'+code,{name:$('#new-name').value.trim()||'우리 가족',pin:'',createdAt:now});
      for(let i=0;i<names.length;i++){await Store.set(`fam/${code}/members/${uid()}`,{name:names[i].name,role:names[i].role,goal:names[i].role==='kid'?8:4,phone:'',color:COLORS[i%COLORS.length],order:i,createdAt:now})}
      await Store.set(`fam/${code}/libs/${uid()}`,{name:'우리집 책장',type:'home',createdAt:now});
    });
    if(ok){Dev.set({code,me:null});connect(code);render();toast('가족을 만들었어요. 코드: '+code)}}
  if(e.target.id==='pin-form'){e.preventDefault();if($('#pin-in').value===String(S.fam.pin)){const t=S.pinFor;S.pinFor=null;if(t&&t!=='__switch')choose(t);else render()}else{$('#pin-err').hidden=false}}
});

/* ---------- 시작 ---------- */
(async()=>{
  try{S.loanOpen=localStorage.getItem('gbs-loanopen')!=='0'}catch(e){}
  await Store.init();
  try{const user=window.claude&&await window.claude.use('user');if(user){const c=await user.can('data.write');if(c===false)S.readOnly=true}}catch(e){}
  S.ready=true;
  const d=Dev.get();
  if(d&&d.code){S.me=d.me||null;connect(d.code)}
  render();
  try{const sp=window.claude&&await window.claude.use('sample');if(sp){S.sample=sp;const lim=await sp.limits().catch(()=>null);S.sampleImg=!!(lim&&lim.images)}}catch(e){}
})();
// 자정이 지나면 D-day 다시 계산
setInterval(()=>{if(S.ready&&S.code&&me()&&$('#sheetWrap').hidden)render()},60*60*1000);
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
